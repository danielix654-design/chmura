<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>megagallery.pl</title>
    
    <link rel="icon" type="image/png" href="https://imgur.com/dUkG2Ul.png">
    
    <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Minecraft', sans-serif;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: none;
            text-rendering: optimizeSpeed;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .bg-glow {
            position: absolute;
            width: 750px;
            height: 750px;
            background: radial-gradient(circle, rgba(160, 0, 255, 0.65) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            filter: blur(220px);
            z-index: 1;
            pointer-events: none;
        }

        .glow-left { 
            top: -15%; 
            left: -15%; 
        }
        .glow-right { 
            bottom: -20%; 
            right: -20%; 
        }

        #snowCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .app-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .top-bar {
            position: absolute;
            top: 40px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 60px;
        }

        .white-btn {
            background-color: #fff;
            color: #000;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 16px;
            text-transform: lowercase;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255,255,255,0.15);
        }

        #authTitle {
            cursor: default;
        }

        .view {
            display: none;
            width: 100%;
            max-width: 550px;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            margin-top: 60px;
        }

        /* Zwiększamy max-width dla panelu z galerią, żeby zmieściło się więcej zdjęć obok siebie */
        #panelView {
            max-width: 900px;
        }

        .view.active {
            display: flex;
        }

        .input-field, .action-btn {
            width: 100%;
            background: transparent;
            border: 3px solid #b500ff;
            border-radius: 25px;
            padding: 20px;
            color: #a0a0a0;
            font-size: 14px;
            text-align: center;
            text-transform: lowercase;
            outline: none;
            transition: all 0.2s;
        }

        .input-field::placeholder {
            color: #555;
        }

        .action-btn {
            width: 100%;
            color: #fff;
            cursor: pointer;
            background: rgba(181, 0, 255, 0.05);
        }

        .action-btn:hover {
            background: rgba(181, 0, 255, 0.2);
            box-shadow: 0 0 20px rgba(181, 0, 255, 0.4);
        }

        /* NOWA SIATKA: ZDJĘCIA JEDEN OBOK DRUGIEGO */
        .photo-list {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            max-height: 60vh;
            overflow-y: auto;
            padding: 10px;
        }

        /* Ustawienie stałej wysokości i równego wyglądu pudełek */
        .photo-item {
            border: 3px solid #b500ff;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(17, 17, 17, 0.6);
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            height: 220px; /* Stała wysokość kafelka */
        }
        
        .photo-item:hover {
            transform: scale(1.04);
        }

        .photo-item img {
            width: 100%;
            flex-grow: 1;
            height: 0; /* Wymusza poprawne skalowanie wewnątrz flexboxa */
            object-fit: cover; /* Zdjęcie ładnie wypełnia górę kafelka */
            background: #080808;
            display: block;
        }

        .photo-label {
            padding: 8px;
            font-size: 11px;
            text-align: center;
            color: #b500ff;
            background: rgba(181, 0, 255, 0.05);
            text-transform: lowercase;
            border-top: 1px solid rgba(181, 0, 255, 0.2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; /* Długie nazwy plików ładnie się przytną z kropkami (...) */
        }

        #fileInput {
            display: none;
        }

        .toggle-link {
            color: #b500ff;
            text-decoration: underline;
            cursor: pointer;
            font-size: 12px;
            margin-top: 15px;
            text-transform: lowercase;
            display: inline-block;
            text-align: center;
        }

        .empty-message {
            grid-column: 1 / -1; /* Zajmuje całą szerokość siatki */
            border: 3px dashed #555;
            color: #555;
            cursor: default;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            font-size: 14px;
        }

        /* MODAL Z PEWNYM SUWAKIEM NA WIERZCHU */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 9999; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(8px);
            overflow: hidden;
        }

        .modal-zoom-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            user-select: none;
            z-index: 10;
        }

        .modal-zoom-container:active {
            cursor: grabbing;
        }

        .modal-content {
            max-width: 85%;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
            transform-origin: center center;
            transition: transform 0.05s ease-out;
            will-change: transform;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            z-index: 100;
        }

        .close-modal:hover {
            color: #b500ff;
        }

        .modal-controls-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 70%, rgba(0,0,0,0));
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 100;
            pointer-events: auto;
        }

        #modalCaption {
            text-align: center;
            color: #ccc;
            font-size: 14px;
            width: 100%;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 80%;
            max-width: 300px;
        }

        .zoom-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 5px;
            outline: none;
        }

        .zoom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #b500ff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(181, 0, 255, 0.6);
        }

        .modal-footer-buttons {
            display: flex; 
            justify-content: center; 
            gap: 15px;
        }

        .modal-download-btn, .modal-delete-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .modal-download-btn {
            background-color: #fff;
            color: #000;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        .modal-download-btn:hover {
            transform: scale(1.05);
            background-color: #e0e0e0;
        }

        .modal-delete-btn {
            background-color: #ef4444;
            color: #fff;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .modal-delete-btn:hover {
            transform: scale(1.05);
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="bg-glow glow-left"></div>
    <div class="bg-glow glow-right"></div>
    <canvas id="snowCanvas"></canvas>

    <div class="app-container">

        <div id="authView" class="view active">
            <div class="top-bar" style="justify-content: flex-start;">
                <div class="white-btn" id="authTitle">witamy</div>
            </div>
            
            <input type="text" class="input-field" id="loginInput" placeholder="login np. test">
            <input type="password" class="input-field" id="passwordInput" placeholder="haslo np. haslo">
            
            <button class="action-btn" id="mainAuthBtn">zaloguj sie</button>
            <span class="toggle-link" id="toggleAuthMode">nie masz konta? zarejestruj sie</span>
        </div>

        <div id="panelView" class="view">
            <div class="top-bar">
                <button class="white-btn" id="publishBtn">publikuj</button>
                <button class="white-btn" id="logoutBtn">wyloguj sie</button>
            </div>

            <input type="file" id="fileInput" accept="image/*" multiple>

            <div class="photo-list" id="photoList"></div>
        </div>

        <div id="imageModal" class="modal">
            <span class="close-modal">&times;</span>
            
            <div class="modal-zoom-container" id="modalZoomContainer">
                <img class="modal-content" id="modalImg" draggable="false">
            </div>

            <div class="modal-controls-wrapper">
                <div id="modalCaption"></div>

                <div class="zoom-controls">
                    <span style="font-size: 12px; color: #555;">-</span>
                    <input type="range" class="zoom-slider" id="zoomSlider" min="1" max="8" step="0.1" value="1">
                    <span style="font-size: 12px; color: #b500ff;">+</span>
                </div>

                <div class="modal-footer-buttons">
                    <button id="modalDownloadBtn" class="modal-download-btn">pobierz zdjecie</button>
                    <button id="modalDeleteBtn" class="modal-delete-btn">usun zdjecie</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://ojzdprutfaqwnztlrhpp.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_-__5TYm1hFjw6wZ2Mmk3TQ_t-Cgf9ji"; 
        
        const supabaseInstance = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- ANIMACJA ŚNIEGU ---
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const numFlakes = 120;
        const flakes = [];

        for (let i = 0; i < numFlakes; i++) {
            flakes.push({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 2.5 + 1,
                d: Math.random() * numFlakes,
                speed: Math.random() * 1.5 + 0.5
            });
        }

        function drawSnow() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.beginPath();
            for (let i = 0; i < numFlakes; i++) {
                const f = flakes[i];
                ctx.moveTo(f.x, f.y);
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
            }
            ctx.fill();
            moveSnow();
        }

        function moveSnow() {
            for (let i = 0; i < numFlakes; i++) {
                const f = flakes[i];
                f.y += f.speed;
                f.x += Math.sin(f.d) * 0.4;

                if (f.y > height) {
                    flakes[i] = { x: Math.random() * width, y: 0, r: f.r, d: f.d, speed: f.speed };
                }
            }
        }

        setInterval(drawSnow, 20);

        // --- LOGIKA APLIKACJI ---
        const authView = document.getElementById('authView');
        const panelView = document.getElementById('panelView');
        const authTitle = document.getElementById('authTitle');
        const mainAuthBtn = document.getElementById('mainAuthBtn');
        const toggleAuthMode = document.getElementById('toggleAuthMode');
        const loginInput = document.getElementById('loginInput');
        const passwordInput = document.getElementById('passwordInput');
        
        const publishBtn = document.getElementById('publishBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const fileInput = document.getElementById('fileInput');
        const photoList = document.getElementById('photoList');

        let currentScale = 1;
        let isDragging = false;
        let startX = 0, startY = 0;
        let translateX = 0, translateY = 0;

        let isLoginMode = true;
        let loggedUser = ""; 
        let uploadedPhotos = [];

        function renderPhotos() {
            photoList.innerHTML = '';
            if (uploadedPhotos.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-message';
                emptyDiv.textContent = 'jeszcze nic tu nie ma :)';
                photoList.appendChild(emptyDiv);
            } else {
                uploadedPhotos.forEach(photo => {
                    const photoItem = document.createElement('div');
                    photoItem.className = 'photo-item';
                    
                    const img = document.createElement('img');
                    img.src = photo.url;
                    
                    const label = document.createElement('div');
                    label.className = 'photo-label';
                    label.textContent = photo.name;

                    photoItem.appendChild(img);
                    photoItem.appendChild(label);
                    
                    photoItem.addEventListener('click', () => {
                        const modal = document.getElementById('imageModal');
                        const modalImg = document.getElementById('modalImg');
                        const modalCaption = document.getElementById('modalCaption');
                        const downloadBtn = document.getElementById('modalDownloadBtn');
                        const deleteBtn = document.getElementById('modalDeleteBtn');
                        const zoomSlider = document.getElementById('zoomSlider');

                        currentScale = 1;
                        translateX = 0;
                        translateY = 0;
                        zoomSlider.value = 1;
                        modalImg.style.transform = `translate(0px, 0px) scale(1)`;

                        modal.style.display = "block";
                        modalImg.src = photo.url;
                        modalCaption.textContent = photo.name;

                        const newDownloadBtn = downloadBtn.cloneNode(true);
                        downloadBtn.parentNode.replaceChild(newDownloadBtn, downloadBtn);

                        const newDeleteBtn = deleteBtn.cloneNode(true);
                        deleteBtn.parentNode.replaceChild(newDeleteBtn, deleteBtn);

                        newDownloadBtn.addEventListener('click', async () => {
                            try {
                                const res = await fetch(photo.url);
                                const blob = await res.blob();
                                const blobUrl = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.href = blobUrl;
                                a.download = photo.name;
                                document.body.appendChild(a);
                                a.click();
                                document.body.removeChild(a);
                                URL.revokeObjectURL(blobUrl);
                            } catch (err) {
                                alert('blad pobierania, sprobuj ponownie!');
                            }
                        });

                        newDeleteBtn.addEventListener('click', async () => {
                            if (confirm(`czy na pewno chcesz usunac zdjecie: ${photo.name}?`)) {
                                try {
                                    const urlParts = photo.url.split('/');
                                    const cloudFileName = urlParts[urlParts.length - 1];

                                    const { error: storageError } = await supabaseInstance.storage
                                        .from('photos')
                                        .remove([cloudFileName]);

                                    if (storageError) {
                                        alert('blad usuwania z chmury: ' + storageError.message);
                                        return;
                                    }

                                    const { error: dbError } = await supabaseInstance
                                        .from('photos_db')
                                        .delete()
                                        .eq('id', photo.id);

                                    if (dbError) {
                                        alert('blad usuwania z bazy: ' + dbError.message);
                                        return;
                                    }

                                    modal.style.display = "none";
                                    alert('zdjecie usuniete!');
                                    loadPhotosFromCloud();

                                } catch (err) {
                                    alert('wystapil blad: ' + err.message);
                                }
                            }
                        });
                    });

                    photoList.appendChild(photoItem);
                });
            }
        }

        const modalZoomContainer = document.getElementById('modalZoomContainer');
        const modalImg = document.getElementById('modalImg');
        const zoomSlider = document.getElementById('zoomSlider');

        function updateModalImageTransform() {
            modalImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
        }

        zoomSlider.addEventListener('input', (e) => {
            currentScale = parseFloat(e.target.value);
            if (currentScale === 1) {
                translateX = 0;
                translateY = 0;
            }
            updateModalImageTransform();
        });

        modalZoomContainer.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomSpeed = 0.15;
            if (e.deltaY < 0) {
                currentScale = Math.min(currentScale + zoomSpeed, 8); 
            } else {
                currentScale = Math.max(currentScale - zoomSpeed, 1);
            }
            
            zoomSlider.value = currentScale;
            
            if (currentScale === 1) {
                translateX = 0;
                translateY = 0;
            }
            updateModalImageTransform();
        });

        modalZoomContainer.addEventListener('mousedown', (e) => {
            if (currentScale > 1) {
                isDragging = true;
                startX = e.clientX - translateX;
                startY = e.clientY - translateY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;
                updateModalImageTransform();
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        document.querySelector('.close-modal').addEventListener('click', () => {
            document.getElementById('imageModal').style.display = "none";
        });

        document.getElementById('imageModal').addEventListener('click', (e) => {
            if (e.target.id === 'imageModal' || e.target.id === 'modalZoomContainer') {
                document.getElementById('imageModal').style.display = "none";
            }
        });

        toggleAuthMode.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            loginInput.value = '';
            passwordInput.value = '';
            if (isLoginMode) {
                authTitle.textContent = "witamy";
                mainAuthBtn.textContent = "zaloguj sie";
                toggleAuthMode.textContent = "nie masz konta? zarejestruj sie";
            } else {
                authTitle.textContent = "rejestracja";
                mainAuthBtn.textContent = "zarejestruj";
                toggleAuthMode.textContent = "masz juz konto? zaloguj sie";
            }
        });

        mainAuthBtn.addEventListener('click', async () => {
            const username = loginInput.value.trim().toLowerCase();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                alert('wpisz login i haslo!');
                return;
            }

            try {
                if (isLoginMode) {
                    let { data, error } = await supabaseInstance.from('users').select('*').eq('username', username);
                    
                    if (error) {
                        alert('blad logowania: ' + error.message);
                        return;
                    }

                    if (data && data.length > 0 && data[0].password === password) {
                        loggedUser = username;
                        authView.classList.remove('active');
                        panelView.classList.add('active');
                        loadPhotosFromCloud();
                    } else {
                        alert('bledny login lub haslo!');
                    }
                } else {
                    let { data, error: checkError } = await supabaseInstance.from('users').select('*').eq('username', username);
                    
                    if (checkError) {
                        alert('blad sprawdzania konta: ' + checkError.message);
                        return;
                    }

                    if (data && data.length > 0) {
                        alert('taki uzytkownik juz istnieje!');
                    } else {
                        const { error: insertError } = await supabaseInstance.from('users').insert([{ username, password }]);
                        if(!insertError) {
                            alert('konto zarejestrowane! mozesz sie zalogowac.');
                            toggleAuthMode.click();
                        } else {
                            alert('blad tworzenia konta: ' + insertError.message);
                        }
                    }
                }
            } catch (err) {
                alert('blad krytyczny: ' + err.message);
            }
        });

        logoutBtn.addEventListener('click', () => {
            loggedUser = "";
            uploadedPhotos = [];
            renderPhotos();
            panelView.classList.remove('active');
            authView.classList.add('active');
            loginInput.value = '';
            passwordInput.value = '';
        });

        publishBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', async (e) => {
            if(e.target.files.length > 0) {
                for(let file of e.target.files) {
                    const fileExt = file.name.split('.').pop();
                    const cloudFileName = `${Math.random()}_${Date.now()}.${fileExt}`;
                    
                    let { error: uploadError } = await supabaseInstance.storage.from('photos').upload(cloudFileName, file);
                    
                    if (!uploadError) {
                        const { data } = supabaseInstance.storage.from('photos').getPublicUrl(cloudFileName);
                        const publicUrl = data.publicUrl;

                        await supabaseInstance.from('photos_db').insert([
                            { name: file.name.toLowerCase(), url: publicUrl, user_owner: loggedUser }
                        ]);
                        
                        loadPhotosFromCloud();
                    } else {
                        alert('blad wysylania pliku: ' + uploadError.message);
                    }
                }
            }
        });

        // WYCIĄGANIE I WYMUSZONE SORTOWANIE W KODZIE JS (OD NAJNOWSZEGO PO ID LUB DACIE)
        async function loadPhotosFromCloud() {
            let { data, error } = await supabaseInstance.from('photos_db')
                .select('*')
                .eq('user_owner', loggedUser);
                
            if(data) {
                // Dodatkowe, potężne sortowanie po stronie JS (od najwyższego ID/daty na wypadek braków w bazie)
                data.sort((a, b) => b.id - a.id);
                
                uploadedPhotos = data;
                renderPhotos();
            }
        }

        renderPhotos();
    </script>
</body>
</html>
